name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint und Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      # --locked: bricht ab, wenn uv.lock nicht zu pyproject.toml passt
      - name: Abhängigkeiten installieren
        run: uv sync --locked

      - name: ruff check (Lint)
        run: uv run ruff check .

      - name: ruff format (Formatprüfung)
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest

  gitleaks:
    name: Secret-Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # gitleaks kommentiert Funde im PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # ganze Historie, nicht nur der letzte Commit

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
