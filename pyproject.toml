[project]
name = "tender-ingest"
version = "0.0.0"
description = "Holt Bekanntmachungen von der TED Search API und legt sie unverändert als Rohdaten ab."
readme = "README.md"
authors = [
    { name = "Tanner", email = "90183594+ChrTanner@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
tender-ingest = "tender_ingest:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.29.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Standard (E4, E7, E9, F) plus Import-Sortierung, typische Bugs, moderne Syntax
extend-select = ["I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
